apiVersion: batch/v1
kind: Job
metadata:
  name: test-batch
  namespace: wmd3i
spec:
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 268412
        runAsGroup: 1133
      containers:
        - name: test
          image: cwang33/k8s-dev:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "=== Hostname: $(hostname) ==="
              nvidia-smi -L
              python -c "import torch; print(f'CUDA: {torch.cuda.is_available()}, GPUs: {torch.cuda.device_count()}')"
              echo "=== Job complete ==="
          resources:
            requests:
              memory: "2Gi"
              cpu: "2"
              nvidia.com/gpu: "1"
            limits:
              memory: "4Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: nfs-home
              mountPath: /sciclone/home/cwang33
            - name: nfs-data10
              mountPath: /sciclone/data10
            - name: nfs-scr10
              mountPath: /sciclone/scr10
            - name: nfs-scr20
              mountPath: /sciclone/scr20
            - name: nfs-proj-ds
              mountPath: /sciclone/proj-ds
      nodeSelector:
        kubernetes.io/hostname: d3i00.sciclone.wm.edu
      tolerations:
        - key: "node"
          operator: "Equal"
          value: "d3i"
          effect: "NoSchedule"
      volumes:
        - name: nfs-home
          nfs:
            server: 128.239.56.166
            path: /sciclone/home/cwang33
        - name: nfs-data10
          nfs:
            server: 128.239.56.30
            path: /sciclone/data10
        - name: nfs-scr10
          nfs:
            server: 128.239.56.168
            path: /sciclone/scr10
        - name: nfs-scr20
          nfs:
            server: 128.239.56.181
            path: /sciclone/scr20
        - name: nfs-proj-ds
          nfs:
            server: 128.239.59.144
            path: /sciclone/proj-ds
