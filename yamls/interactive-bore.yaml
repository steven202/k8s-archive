# Alternative Jupyter debug pod using bore.pub (no Cloudflare needed).
# NOTE: bore.pub is DNS-blocked on W&M cluster (sinkholed to ::).
# This YAML works on clusters without such restrictions.
# When bore connects, check pod logs for the bore.pub URL (e.g. bore.pub:12345).

apiVersion: v1
kind: Pod
metadata:
  name: test-bore
  namespace: wmd3i
  labels:
    app: bore
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 268412
    runAsGroup: 1133
  containers:
    - name: dev
      image: cwang33/k8s-dev:latest
      env:
        - name: HOME
          value: /sciclone/home/cwang33
        - name: SHELL
          value: /bin/bash
      command:
        - /bin/bash
        - -c
        - |
          eval "$(conda shell.bash hook)"
          conda activate base
          export PATH="$HOME/.local/bin:$PATH"

          echo "=== Downloading bore ==="
          mkdir -p /tmp/bore && cd /tmp/bore
          python3 -c "
          import urllib.request, tarfile, io
          url = 'https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz'
          print(f'Downloading {url}...')
          data = urllib.request.urlopen(url).read()
          tarfile.open(fileobj=io.BytesIO(data)).extractall('.')
          " && chmod +x bore

          echo "=== Starting Jupyter on :8888 ==="
          jupyter lab \
            --ip=0.0.0.0 --port=8888 --no-browser \
            --ServerApp.token='dela123' \
            --ServerApp.allow_origin='*' \
            --notebook-dir=/sciclone/home/cwang33 &

          sleep 5

          echo "============================================"
          echo ">>> Tunnel URL will appear below <<<"
          echo "============================================"
          exec /tmp/bore/bore local 8888 --to bore.pub
      ports:
        - containerPort: 8888
          protocol: TCP
      resources:
        requests:
          memory: "6Gi"
          cpu: "3"
          nvidia.com/gpu: "1"
        limits:
          memory: "12Gi"
          cpu: "6"
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: nfs-home
          mountPath: /sciclone/home/cwang33
        - name: nfs-data10
          mountPath: /sciclone/data10
        - name: nfs-scr10
          mountPath: /sciclone/scr10
        - name: nfs-scr20
          mountPath: /sciclone/scr20
  nodeSelector:
    kubernetes.io/hostname: d3i00.sciclone.wm.edu
  tolerations:
    - key: "node"
      operator: "Equal"
      value: "d3i"
      effect: "NoSchedule"
  volumes:
    - name: nfs-home
      nfs:
        server: 128.239.56.166
        path: /sciclone/home/cwang33
    - name: nfs-data10
      nfs:
        server: 128.239.56.30
        path: /sciclone/data10
    - name: nfs-scr10
      nfs:
        server: 128.239.56.168
        path: /sciclone/scr10
    - name: nfs-scr20
      nfs:
        server: 128.239.56.181
        path: /sciclone/scr20
