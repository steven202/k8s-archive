apiVersion: v1
kind: Pod
metadata:
  name: test-code
  namespace: wmd3i
  labels:
    app: code
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 268412
    runAsGroup: 1133
  containers:
    - name: code
      image: cwang33/k8s-dev:latest
      env:
        - name: HOME
          value: /sciclone/home/cwang33
        - name: SHELL
          value: /bin/bash
      command:
        - /bin/bash
        - -c
        - |
          eval "$(conda shell.bash hook)"
          conda activate base
          export PATH="$HOME/.local/bin:$PATH"

          echo "Starting code-server on :8080..."
          code-server --bind-addr 0.0.0.0:8080 --auth none /sciclone/home/cwang33 &
          sleep 2

          echo "Starting Jupyter on :8888..."
          jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root \
            --NotebookApp.token='' --NotebookApp.password='' \
            --notebook-dir=/sciclone/home/cwang33 &
          sleep 5

          echo "Starting cloudflared tunnel..."
          exec cloudflared tunnel --protocol http2 --config "$HOME/.cloudflared/config-k8s-both.yml" run
      ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8888
          protocol: TCP
      resources:
        requests:
          memory: "6Gi"
          cpu: "3"
          nvidia.com/gpu: "1"
        limits:
          memory: "12Gi"
          cpu: "6"
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: nfs-home
          mountPath: /sciclone/home/cwang33
        - name: nfs-data10
          mountPath: /sciclone/data10
        - name: nfs-scr10
          mountPath: /sciclone/scr10
        - name: nfs-scr20
          mountPath: /sciclone/scr20
  nodeSelector:
    kubernetes.io/hostname: d3i00.sciclone.wm.edu
  tolerations:
    - key: "node"
      operator: "Equal"
      value: "d3i"
      effect: "NoSchedule"
  volumes:
    - name: nfs-home
      nfs:
        server: 128.239.56.166
        path: /sciclone/home/cwang33
    - name: nfs-data10
      nfs:
        server: 128.239.56.30
        path: /sciclone/data10
    - name: nfs-scr10
      nfs:
        server: 128.239.56.168
        path: /sciclone/scr10
    - name: nfs-scr20
      nfs:
        server: 128.239.56.181
        path: /sciclone/scr20
