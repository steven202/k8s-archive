apiVersion: v1
kind: Pod
metadata:
  name: test-note
  namespace: wmd3i
  labels:
    app: note
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 268412
    runAsGroup: 1133
  containers:
    - name: note
      image: cwang33/k8s-dev:latest
      env:
        - name: HOME
          value: /sciclone/home/cwang33
      command:
        - /bin/bash
        - -c
        - |
          eval "$(conda shell.bash hook)"
          conda activate base
          echo "Starting Jupyter on :8888..."
          jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root \
            --NotebookApp.token='' --NotebookApp.password='' \
            --notebook-dir=/sciclone/home/cwang33 &
          sleep 5
          echo "Starting cloudflared tunnel..."
          exec cloudflared tunnel --protocol http2 --config "$HOME/.cloudflared/config-k8s-note.yml" run
      ports:
        - containerPort: 8888
          protocol: TCP
      resources:
        requests:
          memory: "4Gi"
          cpu: "2"
          nvidia.com/gpu: "1"
        limits:
          memory: "8Gi"
          cpu: "4"
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: nfs
          mountPath: /sciclone/home/cwang33
  nodeSelector:
    kubernetes.io/hostname: d3i00.sciclone.wm.edu
  tolerations:
    - key: "node"
      operator: "Equal"
      value: "d3i"
      effect: "NoSchedule"
  volumes:
    - name: nfs
      nfs:
        server: 128.239.56.166
        path: /sciclone/home/cwang33
