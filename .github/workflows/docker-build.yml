# GitHub Actions workflow: build + push Docker image on push to main.
# Place at: .github/workflows/docker-build.yml in your repo.
# Requires secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

name: Build and Push K8s Dev Image

on:
  push:
    paths:
      - 'docker/Dockerfile'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: cwang33/k8s-dev:latest
